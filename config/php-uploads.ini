; PHP overrides for the local WordPress container.
; Mounted by compose.yml at /usr/local/etc/php/conf.d/uploads.ini
;
; The official WordPress image ships PHP's defaults (2M upload cap), which is
; too small for plugin zips like ACF Pro and for real photography uploads.

file_uploads = On
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
max_input_vars = 3000
